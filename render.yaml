services:
  - type: web
    name: isla-educativa
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: VITE_SUPABASE_URL
        scope: build
        value: ${VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_ANON_KEY
        scope: build
        value: ${VITE_SUPABASE_ANON_KEY}
      - key: NODE_ENV
        value: production
      - key: VITE_ENV
        value: production
